apiVersion: apps/v1
kind: Deployment
metadata:
  name: sparta-app-deployment   # ← deployment/sparta-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sparta-app
  template:
    metadata:
      labels:
        app: sparta-app
    spec:
      containers:
        - name: sparta-app      # ← sparta-app=
          image: nataliaveselova/sparta-app-k8s-gh
          ports:
            - containerPort: 3000
            
          env:
            - name: DB_HOST
              value: mongodb://sparta-db-service:27017/posts

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3