name: Deploy k8s-sparta-app
on:
  push:
    branches:
      - main

env:
  SHA: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      
      - name: Test
        run: |-
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sparta-app-test -f ./app/Dockerfile.dev ./app
          docker run -e CI=true ${{ secrets.DOCKER_USERNAME }}/sparta-app-test npm test

      - name: Build an image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/sparta-app-k8s-gh:latest -t ${{ secrets.DOCKER_USERNAME }}/sparta-app-k8s-gh:${{ env.SHA }} -f ./app/Dockerfile ./app

      - name: Push images
        run: |-
          docker push ${{ secrets.DOCKER_USERNAME }}/sparta-app-k8s-gh:latest  
          docker push ${{ secrets.DOCKER_USERNAME }}/sparta-app-k8s-gh:${{ env.SHA }}

      - name: Copy Kubernetes manifests to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "k8s/*"
          target: "/home/ubuntu/sparta-app"

      - name: Deploy to EC2 Minikube
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |-
            cd /home/ubuntu/sparta-app             
            minikube status || minikube start --driver=docker 
            kubectl apply -f k8s 
            kubectl set image deployment/sparta-app-deployment sparta-app=${{ secrets.DOCKER_USERNAME }}/sparta-app-k8s-gh:${{ github.sha }} 
            kubectl rollout status deployment/sparta-app-deployment